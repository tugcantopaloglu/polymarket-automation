[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polymarket-bot"
version = "2.0.0"
description = "Professional prediction market trading bot for Polymarket"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Tuğcan Topaloğlu", email = "tugcan@tugcan.dev" }
]
keywords = ["polymarket", "trading", "prediction-markets", "cryptocurrency", "bot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "aiohttp>=3.9.0",
    "py-clob-client>=0.18.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "cryptography>=42.0.0",
    "web3>=6.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-aiohttp>=1.0.0",
    "ruff>=0.2.0",
]
ai = [
    "openai>=1.12.0",
    "anthropic>=0.18.0",
]
all = [
    "polymarket-bot[dev,ai]",
]

[project.scripts]
polymarket-bot = "polymarket_bot.bot:main"

[project.urls]
Homepage = "https://github.com/tugcantopaloglu/polymarket-bot"
Documentation = "https://github.com/tugcantopaloglu/polymarket-bot#readme"
Repository = "https://github.com/tugcantopaloglu/polymarket-bot"
Issues = "https://github.com/tugcantopaloglu/polymarket-bot/issues"

[tool.hatch.build.targets.wheel]
packages = ["polymarket_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "SIM", "ARG"]
ignore = ["E501", "B008", "A003", "ARG001", "ARG002", "SIM102"]

[tool.ruff.lint.isort]
known-first-party = ["polymarket_bot"]

[tool.coverage.run]
source = ["polymarket_bot"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

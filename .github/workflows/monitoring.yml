name: Daily Monitoring Report

on:
  schedule:
    - cron: '0 9 * * *'  # 9 AM UTC daily
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    if: ${{ vars.MONITORING_ENABLED == 'true' }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests jinja2

      - name: Generate Performance Report
        env:
          BOT_API_URL: ${{ secrets.BOT_API_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/generate_report.py

      - name: Upload Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-report-${{ github.run_number }}
          path: reports/
          retention-days: 30

  health-check:
    runs-on: ubuntu-latest
    if: ${{ vars.MONITORING_ENABLED == 'true' }}
    
    steps:
      - name: Check Bot Health
        env:
          BOT_API_URL: ${{ secrets.BOT_API_URL }}
        run: |
          if [ -z "$BOT_API_URL" ]; then
            echo "BOT_API_URL not configured, skipping health check"
            exit 0
          fi
          response=$(curl -s -o /dev/null -w "%{http_code}" "${BOT_API_URL}/api/health" || echo "000")
          if [ "$response" != "200" ]; then
            echo "Bot health check failed with status: $response"
            exit 1
          fi
          echo "Bot is healthy"

      - name: Notify on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="⚠️ Polymarket Bot health check failed!"
          fi

services:
  polymarket-bot:
    build: .
    container_name: polymarket-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./.keystore:/app/.keystore:ro
      - ./.keystore.enc:/app/.keystore.enc:ro
    command: ["--strategies", "arbitrage", "bonding"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - polymarket-net
    depends_on:
      - redis

  polymarket-bot-dry-run:
    build: .
    container_name: polymarket-bot-dry-run
    profiles:
      - dry-run
    env_file:
      - .env
    ports:
      - "8081:8080"
    volumes:
      - ./data:/app/data
    command: ["--dry-run", "--strategies", "arbitrage", "bonding", "momentum"]
    networks:
      - polymarket-net

  polymarket-monitor:
    build: .
    container_name: polymarket-monitor
    profiles:
      - monitor
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: ["--monitor"]
    networks:
      - polymarket-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: polymarket-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://polymarket-bot:8080
    depends_on:
      - polymarket-bot
    networks:
      - polymarket-net

  redis:
    image: redis:7-alpine
    container_name: polymarket-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - polymarket-net

  prometheus:
    image: prom/prometheus:latest
    container_name: polymarket-prometheus
    profiles:
      - monitoring
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - polymarket-net

  grafana:
    image: grafana/grafana:latest
    container_name: polymarket-grafana
    profiles:
      - monitoring
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-polymarket123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - polymarket-net

  alertmanager:
    image: prom/alertmanager:latest
    container_name: polymarket-alertmanager
    profiles:
      - monitoring
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - polymarket-net

  nginx:
    image: nginx:alpine
    container_name: polymarket-nginx
    profiles:
      - production
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./monitoring/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./monitoring/ssl:/etc/nginx/ssl:ro
    depends_on:
      - polymarket-bot
      - frontend
    networks:
      - polymarket-net

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:

networks:
  polymarket-net:
    driver: bridge
